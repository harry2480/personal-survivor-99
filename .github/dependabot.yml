# Dependabot 設定
# 依存関係の自動更新 PR を作成する。
# 詳細: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# 本プロジェクトは Godot（GDScript）製で package manager を使わないため、
# 更新対象は GitHub Actions のみ。Godot 本体の更新は意図的に行う（要件定義 §7）。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
