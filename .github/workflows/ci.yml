name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

env:
  # .godot-version と一致させる（不一致は下の job で検出する）
  GODOT_VERSION: 4.7.2

jobs:
  import:
    name: Import / 起動検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 固定バージョンの一致を確認
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .godot-version)"
          expected="${GODOT_VERSION}-stable"
          if [ "$pinned" != "$expected" ]; then
            echo "::error::.godot-version ($pinned) と workflow の GODOT_VERSION ($expected) が一致しません"
            exit 1
          fi

      - name: Godot をキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Godot を取得
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          if [ ! -x "$HOME/godot/godot" ]; then
            name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
            url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
            curl -fsSL -o /tmp/godot.zip "$url"
            unzip -q /tmp/godot.zip -d ~/godot
            mv "$HOME/godot/${name}" "$HOME/godot/godot"
            chmod +x "$HOME/godot/godot"
          fi
          "$HOME/godot/godot" --version

      - name: Import 検証
        run: |
          "$HOME/godot/godot" --headless --import

      - name: 起動検証
        run: |
          "$HOME/godot/godot" --headless --quit-after 30

  ci-status:
    name: CI ステータス確認
    if: always()
    needs: [import]
    runs-on: ubuntu-latest
    steps:
      - name: 検証の成功を確認
        env:
          IMPORT_RESULT: ${{ needs.import.result }}
        run: |
          if [ "$IMPORT_RESULT" != "success" ]; then
            echo "CI検証結果: $IMPORT_RESULT"
            exit 1
          fi
          echo "CI検証に成功しました"
