name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# 同じ ref で走っている古い実行は打ち切る。macOS runner を無駄に専有しないため。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    name: Static Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python をセットアップ
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements-static-check.txt

      - name: gdtoolkit を導入
        run: pip install -r ci/requirements-static-check.txt

      # gdlint / gdformat / 命名規約 / 依存方向 / shellcheck。
      # shellcheck は ubuntu runner に同梱されている。
      - name: Static Check
        run: scripts/static-check.sh

  import:
    name: Import / 起動検証
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Godot をセットアップ
        id: godot
        uses: ./.github/actions/setup-godot

      # Godot はスクリプトエラーでも exit 0 を返すため、
      # 出力を走査して失敗させるスクリプト経由で実行する。
      - name: Import / 起動検証
        run: GODOT_BIN="${{ steps.godot.outputs.godot-bin }}" scripts/verify-godot.sh

  test:
    name: Headless テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Godot をセットアップ
        id: godot
        uses: ./.github/actions/setup-godot

      # GUT はテスト失敗・push_error・エンジンエラーで非 0 を返す。
      - name: GUT
        run: GODOT_BIN="${{ steps.godot.outputs.godot-bin }}" scripts/run-tests.sh

  export-macos:
    name: macOS Export Validation
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Godot をセットアップ
        id: godot
        uses: ./.github/actions/setup-godot

      # Export Templates は 1GB 近くあるため、バージョン単位でキャッシュする。
      - name: Export Templates をキャッシュ
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Application Support/Godot/export_templates
          key: godot-export-templates-${{ steps.godot.outputs.version }}

      - name: macOS Export Validation
        run: GODOT_BIN="${{ steps.godot.outputs.godot-bin }}" scripts/export-macos.sh

      - name: 成果物を保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-export
          path: build/Project99.zip
          retention-days: 7
          if-no-files-found: error

  # Branch protection の required check はこの job だけを指定する。
  # 実機が必要な Controller Test / Performance Test は自動化できないため含めない。
  ci-status:
    name: CI ステータス確認
    if: always()
    needs: [static-check, import, test, export-macos]
    runs-on: ubuntu-latest
    steps:
      - name: 全 job の成功を確認
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=0
          while IFS=$'\t' read -r job result; do
            printf '%-24s %s\n' "$job" "$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done < <(echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"')

          if [ "$failed" -ne 0 ]; then
            echo "::error::CI に失敗した job があります"
            exit 1
          fi
          echo "CI検証に成功しました"
