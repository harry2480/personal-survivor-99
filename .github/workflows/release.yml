name: Release

# Tag（v*）を押したときに配布物を作る（要件定義 §123 / §124）。
# 手で流したいときのために workflow_dispatch も用意する。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '成果物名に付けるバージョン（未指定なら project.godot の config/version）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: macOS Package
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Godot をセットアップ
        id: godot
        uses: ./.github/actions/setup-godot

      # Export Templates は 1GB 近くあるため、バージョン単位でキャッシュする。
      - name: Export Templates をキャッシュ
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Application Support/Godot/export_templates
          key: godot-export-templates-${{ steps.godot.outputs.version }}

      - name: バージョンを決める
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # v0.1.0 → 0.1.0
            version="${REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(grep -E '^config/version=' project.godot | head -1 | cut -d'"' -f2)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "バージョン: ${version}"

      # Production Build → Package → Checksum をまとめて行う。
      - name: Package
        run: |
          GODOT_BIN="${{ steps.godot.outputs.godot-bin }}" \
          RELEASE_VERSION="${{ steps.version.outputs.version }}" \
          scripts/package-macos.sh

      - name: 成果物を保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30
          if-no-files-found: error

      # Tag から流したときだけ Release を作る。
      # 手動実行（workflow_dispatch）では成果物の確認までにとどめる。
      - name: GitHub Release を作る
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          checksum="$(cat "dist/Project99-${VERSION}-macos.zip.sha256")"
          notes="$(cat <<EOF
          ## 配布物

          | ファイル | 内容 |
          |---|---|
          | \`Project99-${VERSION}-macos.zip\` | macOS 版（Apple Silicon / Intel の universal） |
          | \`Project99-${VERSION}-macos.zip.sha256\` | SHA-256 |

          ## SHA-256

          \`\`\`text
          ${checksum}
          \`\`\`

          ## 動かし方

          1. zip を展開する
          2. \`Project99.app\` を開く（未署名のため、初回は右クリック →「開く」）

          手順とトラブルシュートは [docs/リリース手順.md](docs/リリース手順.md) を参照。
          EOF
          )"
          gh release create "$TAG" \
            --title "Project 99 ${VERSION}" \
            --notes "$notes" \
            "dist/Project99-${VERSION}-macos.zip" \
            "dist/Project99-${VERSION}-macos.zip.sha256"
